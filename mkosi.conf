[Config]
Profiles=
    ssh-server
   # forensics
   # desktop

[Build]
CacheDirectory=mkosi.cache/

[Output]
OutputDirectory=mkosi.output/
Format=disk

[Content]
BaseTrees=%O/base

Packages=
	linux-image-generic
	systemd
	grub-efi
	grub-efi-amd64
	grub-efi-amd64-signed
	tpm2-tools
	shim-signed
	systemd-repart
	systemd-homed
	systemd-boot
CleanPackageMetadata=no

Bootable=yes
UnifiedKernelImages=no
ShimBootloader=signed
#Bootloader=grub-signed

[Runtime]
#Firmware=uefi-secure-boot
#Console=gui
