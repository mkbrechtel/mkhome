---
- name: Add kitty package configuration to mkosi
  template:
    src: mkosi/10-kitty.conf.j2
    dest: "{{ mkosi_conf_dir }}/10-kitty.conf"
    mode: '0644'

- name: Create kitty config directory in mkosi.extra
  file:
    path: "{{ mkosi_extra_dir }}/etc/xdg/kitty"
    state: directory
    mode: '0755'

- name: Install kitty system-wide configuration
  template:
    src: kitty/kitty.conf.j2
    dest: "{{ mkosi_extra_dir }}/etc/xdg/kitty/kitty.conf"
    mode: '0644'