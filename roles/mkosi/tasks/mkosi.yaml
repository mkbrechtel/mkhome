---
- name: Create mkosi.conf.d directory for configuration drop-ins
  file:
    path: "{{ mkosi_conf_dir }}"
    state: directory
    mode: '0755'

- name: Create mkosi.extra directory for extra files
  file:
    path: "{{ mkosi_extra_dir }}"
    state: directory
    mode: '0755'

- name: Create mkosi.extra/etc directory for system configurations
  file:
    path: "{{ mkosi_extra_dir }}/etc"
    state: directory
    mode: '0755'